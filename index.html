<!DOCTYPE html>
<html lang="zh-CN" data-theme="sage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SipStep - 极简健康陪伴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        :root[data-theme="sage"] {
            --c-main: #7A9A7A; --c-main-hover: #678667; --c-light: #E2ECE9; --c-text: #ffffff; --c-ring: rgba(122,154,122,0.5);
            --c-bg: #F4F7F4; --c-text-main: #3A4A3A; --c-text-muted: #6B7B6B; --c-card-bg: #ffffff; --c-card-bg-subtle: #F4F7F4; --c-border: #E2ECE9;
        }
        :root[data-theme="fig"] {
            --c-main: #A66E53; --c-main-hover: #8D5D46; --c-light: #F4ECE1; --c-text: #ffffff; --c-ring: rgba(166,110,83,0.5);
            --c-bg: #FDFBF7; --c-text-main: #4A3326; --c-text-muted: #7A5B4C; --c-card-bg: #ffffff; --c-card-bg-subtle: #F4ECE1; --c-border: #E8D9C8;
        }
        :root[data-theme="spruce"] {
            --c-main: #2D4A43; --c-main-hover: #1F3631; --c-light: #D1DDD6; --c-text: #ffffff; --c-ring: rgba(45,74,67,0.5);
            --c-bg: #F5F6F5; --c-text-main: #1B2C28; --c-text-muted: #4B635C; --c-card-bg: #ffffff; --c-card-bg-subtle: #F5F6F5; --c-border: #D1DDD6;
        }
        :root[data-theme="champagne"] {
            --c-main: #E5D3B3; --c-main-hover: #CDB792; --c-light: #3A3F42; --c-text: #1E2022; --c-ring: rgba(229,211,179,0.5);
            --c-bg: #1E2022; --c-text-main: #E5D3B3; --c-text-muted: #A3A8AB; --c-card-bg: #2A2D30; --c-card-bg-subtle: #3A3F42; --c-border: #3A3F42;
        }
        :root[data-theme="slate-blue"] {
            --c-main: #607D8B; --c-main-hover: #4F6A78; --c-light: #E0E7EA; --c-text: #ffffff; --c-ring: rgba(96,125,139,0.5);
            --c-bg: #F0F4F8; --c-text-main: #2C3E50; --c-text-muted: #546E7A; --c-card-bg: #ffffff; --c-card-bg-subtle: #F0F4F8; --c-border: #CFD8DC;
        }
        :root[data-theme="dark"] {
            --c-main: #38BDF8; --c-main-hover: #0284C7; --c-light: #1E293B; --c-text: #ffffff; --c-ring: rgba(56,189,248,0.5);
            --c-bg: #0F172A; --c-text-main: #F1F5F9; --c-text-muted: #94A3B8; --c-card-bg: #1E293B; --c-card-bg-subtle: #334155; --c-border: #334155;
        }
        :root[data-theme="cream"] {
            --c-main: #E9C46A; --c-main-hover: #D8B052; --c-light: #F4E8E1; --c-text: #ffffff; --c-ring: rgba(233,196,106,0.5);
            --c-bg: #FAF6EE; --c-text-main: #4A3F35; --c-text-muted: #8A7F75; --c-card-bg: #ffffff; --c-card-bg-subtle: #FAF6EE; --c-border: #E8DECF;
        }
        :root[data-theme="mint"] {
            --c-main: #2DD4BF; --c-main-hover: #14B8A6; --c-light: #99F6E4; --c-text: #ffffff; --c-ring: rgba(45,212,191,0.5);
            --c-bg: #F1FFF7; --c-text-main: #134E4A; --c-text-muted: #115E59; --c-card-bg: #ffffff; --c-card-bg-subtle: #F1FFF7; --c-border: #CCFBF1;
        }

        body { background-color: var(--c-bg) !important; transition: background-color 0.3s ease; }
        .text-slate-900, .text-slate-800, .text-slate-700 { color: var(--c-text-main) !important; transition: color 0.3s ease; }
        .text-slate-600, .text-slate-500, .text-slate-400 { color: var(--c-text-muted) !important; transition: color 0.3s ease; }
        .bg-white { background-color: var(--c-card-bg) !important; transition: background-color 0.3s ease; }
        .bg-slate-50 { background-color: var(--c-card-bg-subtle) !important; transition: background-color 0.3s ease; }
        .border-slate-100, .border-slate-200, .border-slate-200\/60 { border-color: var(--c-border) !important; transition: border-color 0.3s ease; }

        .bg-brand { background-color: var(--c-main); }
        .hover\:bg-brand-hover:hover { background-color: var(--c-main-hover); }
        .text-brand { color: var(--c-main); }
        .bg-brand-light { background-color: var(--c-light); }
        .text-brand-text { color: var(--c-text); }
        .border-brand { border-color: var(--c-main); }
        .ring-brand { --tw-ring-color: var(--c-ring); }

        /* Subtle entrance animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        
        /* Jelly bounce for alarm */
        @keyframes jelly {
            0% { transform: scale3d(1, 1, 1); } 30% { transform: scale3d(1.25, 0.75, 1); } 40% { transform: scale3d(0.75, 1.25, 1); }
            50% { transform: scale3d(1.15, 0.85, 1); } 65% { transform: scale3d(0.95, 1.05, 1); } 75% { transform: scale3d(1.05, 0.95, 1); }
            100% { transform: scale3d(1, 1, 1); }
        }
        .animate-jelly { animation: jelly 0.9s both infinite; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 lg:p-8 selection:bg-slate-200">

    <div class="max-w-5xl w-full mx-auto animate-fade-up">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 lg:mb-12">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-brand rounded-xl flex items-center justify-center text-brand-text shadow-sm transition-colors duration-300">
                    <i data-lucide="leaf" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-2xl tracking-tight text-slate-900 leading-none">SipStep</h1>
                    <p class="text-[10px] text-slate-500 mt-1 font-medium tracking-widest uppercase">极简健康陪伴</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 md:gap-4">
                <button id="dndBtn" onclick="toggleDND()" class="flex items-center gap-2 bg-white px-4 py-2.5 rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors group">
                    <i data-lucide="bell" id="dndIcon" class="w-4 h-4 text-slate-400 group-hover:text-slate-600 transition-colors"></i>
                    <span class="text-sm font-semibold text-slate-600 hidden md:block" id="dndText">开启专注</span>
                </button>
                <button onclick="openSettings()" class="w-11 h-11 bg-white rounded-full flex items-center justify-center text-slate-400 hover:text-slate-800 shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-slate-100 transition-colors">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
            <!-- 左侧：趣味文案 & 统计 & 状态 -->
            <div class="lg:col-span-5 flex flex-col gap-6 animate-fade-up delay-100">
                <!-- Main Widget -->
                <div class="bg-white rounded-[2rem] p-7 md:p-8 shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100 flex-1 flex flex-col relative overflow-hidden group min-h-[300px]">
                    <div class="absolute inset-0 bg-gradient-to-br from-brand-light/30 to-transparent pointer-events-none"></div>
                    
                    <!-- Quote at top -->
                    <div class="relative z-10 flex-1">
                        <button onclick="refreshQuote()" class="text-[10px] font-bold text-slate-400 hover:text-slate-900 flex items-center gap-1.5 transition-colors uppercase tracking-widest bg-slate-50 px-2 py-1 rounded-md mb-4 w-fit">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i> 换一句
                        </button>
                        <p id="quoteText" class="text-lg md:text-xl font-semibold text-slate-700 leading-snug">...</p>
                    </div>
                    
                    <div class="w-full h-px bg-slate-100 my-6"></div>

                    <!-- Status at bottom -->
                    <div class="relative z-10 flex items-center gap-4">
                        <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center text-2xl shadow-inner border border-slate-100/50" id="statusEmoji">
                            ☕️
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-base mb-1" id="statusTitle">待命状态</h3>
                            <p class="text-[11px] md:text-xs text-slate-500 font-medium" id="statusDesc">开启右侧提醒，SipStep将陪伴你的专注时刻。</p>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white rounded-[1.5rem] p-5 text-center shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100">
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 mb-1.5 font-bold">走动</p>
                        <p class="text-3xl font-black font-mono text-slate-900" id="standCountDisplay">0</p>
                    </div>
                    <div class="bg-white rounded-[1.5rem] p-5 text-center shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100">
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 mb-1.5 font-bold">饮水</p>
                        <p class="text-3xl font-black font-mono text-slate-900" id="waterCountDisplay">0</p>
                    </div>
                    <div class="bg-white rounded-[1.5rem] p-5 text-center shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100">
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 mb-1.5 font-bold">护眼</p>
                        <p class="text-3xl font-black font-mono text-slate-900" id="eyeCountDisplay">0</p>
                    </div>
                </div>
            </div>

            <!-- 右侧：三个极简 Timer -->
            <div class="lg:col-span-7 flex flex-col gap-4 animate-fade-up delay-200">
                
                <!-- 走动 -->
                <div class="bg-white rounded-[2rem] p-5 md:p-6 shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100 flex items-center justify-between group transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
                    <div class="flex items-center gap-5 md:gap-6">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-slate-50 rounded-2xl flex items-center justify-center text-3xl md:text-4xl shadow-inner border border-slate-100/50 bg-center bg-contain bg-no-repeat" id="sitIconDisplay">🕺</div>
                        <div>
                            <div class="flex items-center gap-2 mb-1.5">
                                <h3 class="font-bold text-slate-800 text-base md:text-lg">走动提醒</h3>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-bold" id="sitBadge">45m</span>
                            </div>
                            <p class="text-4xl md:text-5xl font-black font-mono text-slate-900 tracking-tighter" id="sitTimeDisplay">45:00</p>
                        </div>
                    </div>
                    <button id="sitToggleBtn" onclick="toggleTimer('sit')" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-brand text-brand-text flex items-center justify-center hover:scale-105 transition-all shadow-md hover:bg-brand-hover">
                        <i data-lucide="play" class="w-6 h-6 ml-1 fill-current" id="sitToggleIcon"></i>
                    </button>
                </div>

                <!-- 喝水 -->
                <div class="bg-white rounded-[2rem] p-5 md:p-6 shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100 flex items-center justify-between group transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
                    <div class="flex items-center gap-5 md:gap-6">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-slate-50 rounded-2xl flex items-center justify-center text-3xl md:text-4xl shadow-inner border border-slate-100/50 bg-center bg-contain bg-no-repeat" id="waterIconDisplay">🥤</div>
                        <div>
                            <div class="flex items-center gap-2 mb-1.5">
                                <h3 class="font-bold text-slate-800 text-base md:text-lg">饮水提醒</h3>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-bold" id="waterBadge">60m</span>
                            </div>
                            <p class="text-4xl md:text-5xl font-black font-mono text-slate-900 tracking-tighter" id="waterTimeDisplay">60:00</p>
                        </div>
                    </div>
                    <button id="waterToggleBtn" onclick="toggleTimer('water')" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-brand text-brand-text flex items-center justify-center hover:scale-105 transition-all shadow-md hover:bg-brand-hover">
                        <i data-lucide="play" class="w-6 h-6 ml-1 fill-current" id="waterToggleIcon"></i>
                    </button>
                </div>

                <!-- 护眼 -->
                <div class="bg-white rounded-[2rem] p-5 md:p-6 shadow-[0_2px_20px_rgb(0,0,0,0.02)] border border-slate-100 flex items-center justify-between group transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
                    <div class="flex items-center gap-5 md:gap-6">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-slate-50 rounded-2xl flex items-center justify-center text-3xl md:text-4xl shadow-inner border border-slate-100/50 bg-center bg-contain bg-no-repeat" id="eyeIconDisplay">🌿</div>
                        <div>
                            <div class="flex items-center gap-2 mb-1.5">
                                <h3 class="font-bold text-slate-800 text-base md:text-lg">护眼提醒</h3>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-bold" id="eyeBadge">20m</span>
                            </div>
                            <p class="text-4xl md:text-5xl font-black font-mono text-slate-900 tracking-tighter" id="eyeTimeDisplay">20:00</p>
                        </div>
                    </div>
                    <button id="eyeToggleBtn" onclick="toggleTimer('eye')" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-brand text-brand-text flex items-center justify-center hover:scale-105 transition-all shadow-md hover:bg-brand-hover">
                        <i data-lucide="play" class="w-6 h-6 ml-1 fill-current" id="eyeToggleIcon"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- 弹窗层: 设置面板 -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] w-full max-w-md flex flex-col shadow-2xl max-h-[90vh] overflow-hidden transform scale-95 transition-transform duration-300 border border-slate-100" id="settingsContent">
            
            <div class="flex justify-between items-center p-6 border-b border-slate-100">
                <h2 class="text-xl font-bold text-slate-900">偏好设置</h2>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 p-2 rounded-full transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto no-scrollbar space-y-8">
                <!-- 主题色系 -->
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">主题色系</h3>
                    <div class="flex gap-4">
                        <button class="w-8 h-8 rounded-full bg-[#7A9A7A] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="sage" onclick="selectTheme('sage')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#A66E53] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="fig" onclick="selectTheme('fig')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#2D4A43] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="spruce" onclick="selectTheme('spruce')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#E5D3B3] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="champagne" onclick="selectTheme('champagne')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#607D8B] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="slate-blue" onclick="selectTheme('slate-blue')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#0F172A] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="dark" onclick="selectTheme('dark')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#E9C46A] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="cream" onclick="selectTheme('cream')"></button>
                        <button class="w-8 h-8 rounded-full bg-[#2DD4BF] ring-2 ring-offset-2 ring-transparent transition-all hover:scale-110 theme-btn" data-color="mint" onclick="selectTheme('mint')"></button>
                    </div>
                </div>

                <!-- 预设时长 -->
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">时长设定 (分钟)</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-slate-50 p-3 rounded-2xl flex flex-col gap-2">
                            <label class="block text-[10px] font-bold text-slate-500 text-center">走动</label>
                            <select id="sitSelect" class="w-full bg-white border border-slate-200 rounded-xl px-1 py-1.5 text-center font-mono text-sm font-bold text-slate-700 focus:outline-none focus:border-slate-400">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="30">30</option>
                                <option value="45">45</option>
                                <option value="60">60</option>
                                <option value="90">90</option>
                                <option value="custom">自定义</option>
                            </select>
                            <input type="number" id="sitInput" class="hidden w-full bg-white border border-slate-200 rounded-xl px-1 py-1.5 text-center font-mono text-sm font-bold text-slate-700 focus:outline-none" min="1" max="120">
                        </div>
                        <div class="bg-slate-50 p-3 rounded-2xl flex flex-col gap-2">
                            <label class="block text-[10px] font-bold text-slate-500 text-center">喝水</label>
                            <select id="waterSelect" class="w-full bg-white border border-slate-200 rounded-xl px-1 py-1.5 text-center font-mono text-sm font-bold text-slate-700 focus:outline-none focus:border-slate-400">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="30">30</option>
                                <option value="45">45</option>
                                <option value="60">60</option>
                                <option value="90">90</option>
                                <option value="custom">自定义</option>
                            </select>
                            <input type="number" id="waterInput" class="hidden w-full bg-white border border-slate-200 rounded-xl px-1 py-1.5 text-center font-mono text-sm font-bold text-slate-700 focus:outline-none" min="1" max="120">
                        </div>
                        <div class="bg-slate-50 p-3 rounded-2xl flex flex-col gap-2">
                            <label class="block text-[10px] font-bold text-slate-500 text-center">护眼</label>
                            <select id="eyeSelect" class="w-full bg-white border border-slate-200 rounded-xl px-1 py-1.5 text-center font-mono text-sm font-bold text-slate-700 focus:outline-none focus:border-slate-400">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20 (推荐)</option>
                                <option value="30">30</option>
                                <option value="45">45</option>
                                <option value="60">60</option>
                                <option value="90">90</option>
                                <option value="custom">自定义</option>
                            </select>
                            <input type="number" id="eyeInput" class="hidden w-full bg-white border border-slate-200 rounded-xl px-1 py-1.5 text-center font-mono text-sm font-bold text-slate-700 focus:outline-none" min="1" max="120">
                        </div>
                    </div>
                </div>

                <!-- 图标设定 -->
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">个性化图标</h3>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <button onclick="applyIconPreset('emoji')" class="text-xs py-2 bg-slate-50 rounded-xl font-bold text-slate-600 hover:bg-slate-100">经典Emoji</button>
                        <button onclick="applyIconPreset('nature')" class="text-xs py-2 bg-slate-50 rounded-xl font-bold text-slate-600 hover:bg-slate-100">清新自然</button>
                        <button onclick="applyIconPreset('minimal')" class="text-xs py-2 bg-slate-50 rounded-xl font-bold text-slate-600 hover:bg-slate-100">极简冷淡</button>
                        <button onclick="applyIconPreset('cute')" class="text-xs py-2 bg-slate-50 rounded-xl font-bold text-slate-600 hover:bg-slate-100">软萌治愈</button>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <input type="text" id="sitIconInput" class="w-full text-center bg-slate-50 border border-slate-200 rounded-xl py-3 text-2xl focus:outline-none focus:border-slate-400 transition-colors" value="🕺">
                            <button onclick="document.getElementById('sitImgUpload').click()" class="mt-2 w-full text-[10px] text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 py-1.5 rounded-lg transition-colors font-medium">自定义图片</button>
                            <input type="file" id="sitImgUpload" class="hidden" accept="image/*">

    <!-- 弹窗层: 提醒 -->
    <div id="alarmModal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">

            <h2 id="alarmTitle" class="text-2xl font-black text-slate-900 mb-2 tracking-tight">该喝水啦！</h2>
            
            <div class="bg-slate-50 rounded-2xl p-5 my-6 text-left border border-slate-100">

                    我已完成 <i data-lucide="check" class="w-4 h-4"></i>
                </button>
                <button onclick="snoozeAlarm()" class="w-full text-slate-500 font-bold py-3 hover:text-slate-900 hover:bg-slate-50 rounded-2xl transition-colors text-sm">
                    稍后提醒 (5分钟)
                </button>

    <script>
        lucide.createIcons();

        const QUOTES = [
            "Sip it, shake it, don't break it.",
            "喝水不积极，思想有问题；久坐不活动，腰椎要抗议。",
            "💡 研究表明：每坐1小时起身活动5分钟，比周末狂奔10公里更能拯救腰椎。",
            "你是一盆需要浇水的植物，记得带自己去散散步。🪴",
            "久坐是新的吸烟，但喝水是免费的解药。",
            "💡 科学提示：大脑的80%是水，别让你的灵感干涸了。",
            "Bug调不出？不如喝口水走两步，让灵感重新连接。✨",
            "你的颈椎说它想放个假，只要5分钟就好。",
            "世界那么大，起来走走看。眼前的屏幕，不是你的全部。",
            "拉个伸，扭个腰，工作效率节节高。",
            "【打工人警报】 你的椅子已经连续占领你 30 分钟了。起立，夺回你双腿的主权！",
            "再不起来活动，你的灵魂就要和椅子贴在一起，变成不可分割的资产了。",
            "【摸鱼特许令】 去接水的这 3 分钟，不会扣你工资。现在，起立，带薪散步开始。",
            "【护眼提示】 盯着屏幕太久，看老板的脸都会自带滤镜。望向窗外 20 米，洗洗眼。",
            "喝水不仅是免费的解药，更是离开工位激发灵感的好时机💡",
            "工作不会因为你多坐 5 分钟而做完，但腰椎可能会因为你多站 5 分钟而向你致敬。",
            "【脊椎拯救行动】 把头往后仰，看看天花板上有没有藏着你消失的灵感。💡",
            "水杯空了就像电量变红，快去给自己充个电吧！⚡️",
            "活动活动筋骨，让卡路里感受一下你打工的愤怒！🔥"
        ];

        const PRESETS = {
            emoji: { sit: '🕺', water: '🥤', eye: '🌿' },
            nature: { sit: '🏃', water: '💧', eye: '🍀' },
            minimal: { sit: '👟', water: '🧊', eye: '👁️' },
            cute: { sit: '🐹', water: '🍼', eye: '✨' }
        };

        let state = {
            theme: 'sage',
            isDND: false,
            soundEnabled: true,
            soundMode: 'unified', // unified | separate
            soundTypeUnified: 'classic',
            soundTypeSit: 'classic',
            soundTypeWater: 'chime',
            soundTypeEye: 'marimba',
            notificationsEnabled: false,
            statsDate: new Date().toLocaleDateString(),
            counts: { sit: 0, water: 0, eye: 0 },
            icons: { sit: '🕺', water: '🥤', eye: '🌿' },
            activeAlarm: null
        };

        let timers = {
            sit: { interval: 45, remaining: 45 * 60, running: false, lastTick: 0 },
            water: { interval: 60, remaining: 60 * 60, running: false, lastTick: 0 },
            eye: { interval: 20, remaining: 20 * 60, running: false, lastTick: 0 }
        };

        function refreshQuote() {
            const el = document.getElementById('quoteText');
            let current = el.innerText;
            let next = QUOTES[Math.floor(Math.random() * QUOTES.length)];
            while(next === current && QUOTES.length > 1) {
                next = QUOTES[Math.floor(Math.random() * QUOTES.length)];
            }
            el.style.opacity = 0;
            setTimeout(() => {
                el.innerText = next;
                el.style.opacity = 1;
            }, 200);
        }
        document.getElementById('quoteText').style.transition = "opacity 0.3s ease";
        refreshQuote();

        function loadStorage() {
            const savedState = localStorage.getItem('sipstep_state');
            const savedTimers = localStorage.getItem('sipstep_timers');
            if (savedState) {
                const parsed = JSON.parse(savedState);
                if (parsed.statsDate !== state.statsDate) {
                    parsed.counts = { sit: 0, water: 0, eye: 0 };
                    parsed.statsDate = state.statsDate;
                }
                state = { ...state, ...parsed };
                // Handle legacy icon fields
                if (parsed.sitIcon) state.icons.sit = parsed.sitIcon;
                if (parsed.waterIcon) state.icons.water = parsed.waterIcon;
                if (parsed.eyeIcon) state.icons.eye = parsed.eyeIcon;
            }
            if (savedTimers) {
                const pt = JSON.parse(savedTimers);
                ['sit','water','eye'].forEach(k => {
                    if(pt[k]) {
                        timers[k].interval = pt[k].interval;
                        timers[k].remaining = pt[k].remaining;
                        timers[k].running = false;
                    }
                });
            }
            applyTheme(state.theme);
            updateUI();
        }

        function saveStorage() {
            localStorage.setItem('sipstep_state', JSON.stringify(state));
            const timerSave = {
                sit: { interval: timers.sit.interval, remaining: timers.sit.remaining },
                water: { interval: timers.water.interval, remaining: timers.water.remaining },
                eye: { interval: timers.eye.interval, remaining: timers.eye.remaining }
            };
            localStorage.setItem('sipstep_timers', JSON.stringify(timerSave));
        }

        function applyTheme(color) {
            state.theme = color;
            document.documentElement.setAttribute('data-theme', color);
            
            // Update selected ring in settings
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if(btn.dataset.color === color) {
                    btn.classList.add('ring-brand');
                    btn.classList.remove('ring-transparent');
                } else {
                    btn.classList.remove('ring-brand');
                    btn.classList.add('ring-transparent');
                }
            });
        }
        window.selectTheme = applyTheme;

        function formatTime(seconds) {
            if(seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function renderIcon(containerId, iconData) {
            const el = document.getElementById(containerId);
            if (!el) return;
            if (iconData.startsWith('data:image/')) {
                el.innerText = '';
                el.style.backgroundImage = `url(${iconData})`;
            } else {
                el.innerText = iconData;
                el.style.backgroundImage = 'none';
            }
        }

        function updateStatusUI() {
            const titleEl = document.getElementById('statusTitle');
            const descEl = document.getElementById('statusDesc');
            const emojiEl = document.getElementById('statusEmoji');
            
            if (state.isDND) {
                emojiEl.innerText = '🧘‍♀️';
                titleEl.innerText = '专注中';
                descEl.innerText = '已暂停提醒，全心投入当前任务。';
            } else {
                let isAnyRunning = timers.sit.running || timers.water.running || timers.eye.running;
                if (!isAnyRunning) {
                    emojiEl.innerText = '☕️';
                    titleEl.innerText = '待命状态';
                    descEl.innerText = '开启右侧提醒，SipStep将陪伴你的专注时刻。';
                } else {
                    let sitW = timers.sit.running && timers.sit.remaining < 5 * 60;
                    let waterW = timers.water.running && timers.water.remaining < 5 * 60;
                    let eyeW = timers.eye.running && timers.eye.remaining < 3 * 60;
                    
                    if (sitW || waterW || eyeW) {
                        emojiEl.innerText = '🥀';
                        titleEl.innerText = '略显疲态';
                        descEl.innerText = '快要到休息时间了，再坚持一下下！';
                    } else {
                        emojiEl.innerText = '🕶️';
                        titleEl.innerText = '元气满满';
                        descEl.innerText = '正在专注工作中，保持好状态！';
                    }
                }
            }
        }

        function updateUI() {
            document.getElementById('standCountDisplay').innerText = state.counts.sit;
            document.getElementById('waterCountDisplay').innerText = state.counts.water;
            document.getElementById('eyeCountDisplay').innerText = state.counts.eye;
            
            ['sit', 'water', 'eye'].forEach(type => {
                renderIcon(`${type}IconDisplay`, state.icons[type]);
                document.getElementById(`${type}Badge`).innerText = `${timers[type].interval}m`;
                
                const btn = document.getElementById(`${type}ToggleBtn`);
                const icon = document.getElementById(`${type}ToggleIcon`);
                if (timers[type].running) {
                    btn.classList.replace('bg-brand', 'bg-brand-light');
                    btn.classList.replace('text-brand-text', 'text-brand');
                    btn.classList.remove('hover:bg-brand-hover');
                    icon.setAttribute('data-lucide', 'pause');
                    icon.classList.remove('ml-1', 'fill-current');
                } else {
                    btn.classList.replace('bg-brand-light', 'bg-brand');
                    btn.classList.replace('text-brand', 'text-brand-text');
                    btn.classList.add('hover:bg-brand-hover');
                    icon.setAttribute('data-lucide', 'play');
                    icon.classList.add('ml-1', 'fill-current');
                }
            });
            lucide.createIcons();
            
            const dndBtn = document.getElementById('dndBtn');
            const dndIcon = document.getElementById('dndIcon');
            const dndText = document.getElementById('dndText');
            if (state.isDND) {
                dndBtn.classList.add('bg-brand', 'border-brand', 'text-brand-text');
                dndBtn.classList.remove('bg-white', 'border-slate-100', 'hover:bg-slate-50');
                dndIcon.classList.replace('text-slate-400', 'text-brand-text');
                dndIcon.setAttribute('data-lucide', 'moon');
                dndText.innerText = "专注中 (已暂停)";
                dndText.classList.replace('text-slate-600', 'text-brand-text');
            } else {
                dndBtn.classList.remove('bg-brand', 'border-brand', 'text-brand-text');
                dndBtn.classList.add('bg-white', 'border-slate-100', 'hover:bg-slate-50');
                dndIcon.classList.replace('text-brand-text', 'text-slate-400');
                dndIcon.setAttribute('data-lucide', 'bell');
                dndText.innerText = "开启专注";
                dndText.classList.replace('text-brand-text', 'text-slate-600');
            }
            lucide.createIcons();
            
            updateStatusUI();
        }

        window.toggleTimer = function(type) {
            const t = timers[type];
            if (t.running) {
                t.running = false;
            } else {
                t.running = true;
                t.lastTick = Date.now();
                if (t.remaining <= 0) t.remaining = t.interval * 60;
                if (state.isDND) toggleDND();
            }
            saveStorage();
            updateUI();
        }

        window.toggleDND = function() {
            state.isDND = !state.isDND;
            if (!state.isDND) {
                const now = Date.now();
                ['sit', 'water', 'eye'].forEach(k => timers[k].lastTick = now);
            }
            saveStorage();
            updateUI();
        }

        setInterval(() => {
            const now = Date.now();
            let needsUIUpdate = false;
            
            ['sit', 'water', 'eye'].forEach(type => {
                const t = timers[type];
                if (t.running) {
                    if (!state.isDND) {
                        const delta = (now - t.lastTick) / 1000;
                        t.remaining -= delta;
                        needsUIUpdate = true;
                        
                        if (t.remaining <= 0) {
                            t.remaining = 0;
                            t.running = false;
                            triggerAlarm(type);
                        }
                    }
                    t.lastTick = now;
                }
                document.getElementById(`${type}TimeDisplay`).innerText = formatTime(t.remaining);
            });
            if (needsUIUpdate) updateStatusUI(); // Only update status if timers are changing
        }, 100);

        const playSoundPreview = (t) => {
            if (!state.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const pt = (freq, startTime, duration, oscType='triangle', vol=0.1) => {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.type = oscType;
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, startTime);
                    g.gain.linearRampToValueAtTime(vol, startTime + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(startTime); o.stop(startTime + duration);
                };

                if (t === 'classic') { pt(523.25, now, 0.4, 'triangle', 0.2); pt(659.25, now + 0.15, 0.4, 'triangle', 0.2); pt(783.99, now + 0.3, 0.6, 'triangle', 0.2); }
                else if (t === 'retro') { pt(523.25, now, 0.1, 'square', 0.05); pt(659.25, now + 0.1, 0.1, 'square', 0.05); pt(783.99, now + 0.2, 0.2, 'square', 0.05); }
                else if (t === 'marimba') { pt(523.25, now, 0.1, 'sine', 0.3); pt(659.25, now + 0.15, 0.3, 'sine', 0.3); }
                else if (t === 'chime') { pt(880.00, now, 1.5, 'sine', 0.15); pt(1046.50, now + 0.3, 2.0, 'sine', 0.15); }
                else if (t === 'bell') { pt(1046.50, now, 1.0, 'sine', 0.2); pt(1318.51, now + 0.1, 1.5, 'sine', 0.2); }
                else if (t === 'bubble') { pt(349.23, now, 0.1, 'sine', 0.2); pt(440.00, now + 0.1, 0.1, 'sine', 0.2); pt(523.25, now + 0.2, 0.1, 'sine', 0.2); }
            } catch(e) {}
        };

        const playAlarmTone = (type) => {
            if (!state.soundEnabled) return;
            const t = state.soundMode === 'separate' ? state['soundType' + type.charAt(0).toUpperCase() + type.slice(1)] : state.soundTypeUnified;
            playSoundPreview(t);
        };

        const playSuccessTone = () => {
            if (!state.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const pt = (freq, st, dur) => {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.type = 'sine'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.1, st + 0.05); g.gain.exponentialRampToValueAtTime(0.001, st + dur);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(st); o.stop(st + dur);
                };
                pt(1046.5, now, 0.5); pt(1318.51, now + 0.1, 0.8);
            } catch(e) {}
        }

        function sendDesktopNotification(title, body) {
            if (!("Notification" in window)) {
                console.warn("这个浏览器不支持桌面通知");
                return;
            }
            if (Notification.permission === "granted") {
                new Notification(title, { body: body });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification(title, { body: body });
                    }
                });
            }
        }

        function triggerAlarm(type) {
            if (state.activeAlarm) return;
            state.activeAlarm = type;
            
            const titles = { sit: "该走动啦！", water: "该喝水啦！", eye: "护眼时间！" };
            const texts = {
                sit: "离开座位，伸个懒腰，让血液重新循环一下。🚶",
                water: "接一杯温水，顺便和饮水机旁的同事打个招呼。👋",
                eye: "望向远处，眨眨眼，让紧绷的视神经放松下来。🌿"
            };
            
            document.getElementById('alarmTitle').innerText = titles[type];
            document.getElementById('alarmCardText').innerText = texts[type];
            renderIcon('alarmEmoji', state.icons[type]);
            
            const modal = document.getElementById('alarmModal');
            const content = document.getElementById('alarmContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            playAlarmTone(type);
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
            
            if (state.notificationsEnabled) {
                sendDesktopNotification("SipStep: " + titles[type], texts[type]);
            }
        }

        window.stopAlarm = function(completed) {
            if (!state.activeAlarm) return;
            const type = state.activeAlarm;
            
            if (completed) {
                state.counts[type]++;
                timers[type].remaining = timers[type].interval * 60;
                timers[type].running = true;
                timers[type].lastTick = Date.now();
                playSuccessTone();
                refreshQuote();
            }
            
            closeAlarmModal();
            saveStorage();
            updateUI();
        }

        window.snoozeAlarm = function() {
            if (!state.activeAlarm) return;
            const type = state.activeAlarm;
            timers[type].remaining = 5 * 60;
            timers[type].running = true;
            timers[type].lastTick = Date.now();
            
            closeAlarmModal();
            saveStorage();
            updateUI();
        }

        function closeAlarmModal() {
            state.activeAlarm = null;
            const modal = document.getElementById('alarmModal');
            const content = document.getElementById('alarmContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        // --- Settings Area ---

        const setIconInput = (inputEl, val) => {
            if (val && val.startsWith('data:image/')) {
                inputEl.dataset.imgBase64 = val;
                inputEl.style.backgroundImage = `url(${val})`;
                inputEl.style.backgroundSize = 'contain';
                inputEl.style.backgroundPosition = 'center';
                inputEl.style.backgroundRepeat = 'no-repeat';
                inputEl.style.color = 'transparent';
                inputEl.value = 'IMG';
            } else {
                inputEl.dataset.imgBase64 = '';
                inputEl.style.backgroundImage = 'none';
                inputEl.style.color = 'inherit';
                inputEl.value = val;
            }
        };

        window.setQuickEmoji = function(type, emoji) {
            const input = document.getElementById(type + 'IconInput');
            setIconInput(input, emoji);
        };

        window.applyIconPreset = function(presetKey) {
            const p = PRESETS[presetKey];
            if(!p) return;
            setIconInput(document.getElementById('sitIconInput'), p.sit);
            setIconInput(document.getElementById('waterIconInput'), p.water);
            setIconInput(document.getElementById('eyeIconInput'), p.eye);
        };

        // Handle image uploads for icons
        ['sit', 'water', 'eye'].forEach(t => {
            const uploadEl = document.getElementById(`${t}ImgUpload`);
            const inputEl = document.getElementById(`${t}IconInput`);
            uploadEl.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) { setIconInput(inputEl, evt.target.result); }
                    reader.readAsDataURL(file);
                }
            });
        });

        window.openSettings = function() {
            ['sit', 'water', 'eye'].forEach(t => {
                const select = document.getElementById(`${t}Select`);
                const input = document.getElementById(`${t}Input`);
                const current = timers[t].interval;
                
                let match = false;
                Array.from(select.options).forEach(opt => {
                    if(parseInt(opt.value) === current) match = true;
                });
                
                if (match) {
                    select.value = current;
                    input.classList.add('hidden');
                } else {
                    select.value = 'custom';
                    input.value = current;
                    input.classList.remove('hidden');
                }
                
                select.onchange = (e) => {
                    if (e.target.value === 'custom') {
                        input.classList.remove('hidden');
                        input.focus();
                    } else {
                        input.classList.add('hidden');
                    }
                };
                
                setIconInput(document.getElementById(`${t}IconInput`), state.icons[t]);
            });
            
            updateToggleUI('soundToggle', 'soundBg', 'soundDot', state.soundEnabled, 'bg-slate-900', 'translate-x-5');
            document.getElementById('soundSettingsArea').style.opacity = state.soundEnabled ? '1' : '0.5';
            document.getElementById('soundSettingsArea').style.pointerEvents = state.soundEnabled ? 'auto' : 'none';
            
            document.getElementById('soundModeSelect').value = state.soundMode;
            document.getElementById('soundTypeUnified').value = state.soundTypeUnified;
            document.getElementById('soundTypeSit').value = state.soundTypeSit;
            document.getElementById('soundTypeWater').value = state.soundTypeWater;
            document.getElementById('soundTypeEye').value = state.soundTypeEye;
            updateSoundSettingsVis();

            updateToggleUI('notificationToggle', 'notificationBg', 'notificationDot', state.notificationsEnabled, 'bg-slate-900', 'translate-x-5');
            
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        window.closeSettings = function() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function updateToggleUI(checkboxId, bgId, dotId, isChecked, activeBgClass, translateClass) {
            const cb = document.getElementById(checkboxId);
            const bg = document.getElementById(bgId);
            const dot = document.getElementById(dotId);
            cb.checked = isChecked;
            if (isChecked) {
                bg.classList.add(activeBgClass); bg.classList.remove('bg-slate-200');
                dot.classList.add(translateClass);
            } else {
                bg.classList.remove(activeBgClass); bg.classList.add('bg-slate-200');
                dot.classList.remove(translateClass);
            }
        }

        function updateSoundSettingsVis() {
            const mode = document.getElementById('soundModeSelect').value;
            if (mode === 'unified') {
                document.getElementById('unifiedSoundControl').classList.remove('hidden');
                document.getElementById('separateSoundControls').classList.add('hidden');
                document.getElementById('separateSoundControls').classList.remove('flex');
            } else {
                document.getElementById('unifiedSoundControl').classList.add('hidden');
                document.getElementById('separateSoundControls').classList.remove('hidden');
                document.getElementById('separateSoundControls').classList.add('flex');
            }
        }

        document.getElementById('soundModeSelect').addEventListener('change', updateSoundSettingsVis);
        
        document.getElementById('soundTypeUnified').addEventListener('change', (e) => playSoundPreview(e.target.value));
        ['Sit', 'Water', 'Eye'].forEach(type => {
            document.getElementById('soundType' + type).addEventListener('change', (e) => playSoundPreview(e.target.value));
        });

        document.getElementById('soundToggle').addEventListener('change', (e) => {
            state.soundEnabled = e.target.checked;
            updateToggleUI('soundToggle', 'soundBg', 'soundDot', state.soundEnabled, 'bg-slate-900', 'translate-x-5');
            document.getElementById('soundSettingsArea').style.opacity = state.soundEnabled ? '1' : '0.5';
            document.getElementById('soundSettingsArea').style.pointerEvents = state.soundEnabled ? 'auto' : 'none';
            if(state.soundEnabled) playSuccessTone();
        });

        window.handleNotificationChange = function(el) {
            if (el.checked) {
                if (!("Notification" in window)) {
                    alert("您的浏览器不支持桌面通知。");
                    el.checked = false;
                    return;
                }
                if (Notification.permission === "granted") {
                    state.notificationsEnabled = true;
                    updateToggleUI('notificationToggle', 'notificationBg', 'notificationDot', true, 'bg-slate-900', 'translate-x-5');
                    sendDesktopNotification("SipStep", "桌面通知已开启！");
                } else if (Notification.permission !== "denied") {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            state.notificationsEnabled = true;
                            updateToggleUI('notificationToggle', 'notificationBg', 'notificationDot', true, 'bg-slate-900', 'translate-x-5');
                            sendDesktopNotification("SipStep", "桌面通知已开启！");
                        } else {
                            state.notificationsEnabled = false;
                            el.checked = false;
                            updateToggleUI('notificationToggle', 'notificationBg', 'notificationDot', false, 'bg-slate-900', 'translate-x-5');
                        }
                    });
                } else {
                    alert("您之前拒绝了通知权限，请在浏览器设置中手动开启。");
                    el.checked = false;
                    updateToggleUI('notificationToggle', 'notificationBg', 'notificationDot', false, 'bg-slate-900', 'translate-x-5');
                }
            } else {
                state.notificationsEnabled = false;
                updateToggleUI('notificationToggle', 'notificationBg', 'notificationDot', false, 'bg-slate-900', 'translate-x-5');
            }
        }

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            // Save Timers
            ['sit', 'water', 'eye'].forEach(t => {
                const select = document.getElementById(`${t}Select`);
                const input = document.getElementById(`${t}Input`);
                let newVal = select.value === 'custom' ? parseInt(input.value) : parseInt(select.value);
                if(isNaN(newVal) || newVal < 1) newVal = 30; // fallback
                
                if (timers[t].interval !== newVal) {
                    timers[t].interval = newVal;
                    timers[t].remaining = newVal * 60;
                }
                
                const iconInput = document.getElementById(`${t}IconInput`);
                if (iconInput.dataset.imgBase64) {
                    state.icons[t] = iconInput.dataset.imgBase64;
                } else {
                    state.icons[t] = iconInput.value || state.icons[t];
                }
            });
            
            // Save Sounds
            state.soundMode = document.getElementById('soundModeSelect').value;
            state.soundTypeUnified = document.getElementById('soundTypeUnified').value;
            state.soundTypeSit = document.getElementById('soundTypeSit').value;
            state.soundTypeWater = document.getElementById('soundTypeWater').value;
            state.soundTypeEye = document.getElementById('soundTypeEye').value;
            
            saveStorage();
            updateUI();
            closeSettings();
        });

        loadStorage();
    </script>
</body>
</html>
